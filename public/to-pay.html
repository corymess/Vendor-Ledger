	<h2>To Pay</h2>
	<p>Invoices that are completed and approved but not yet paid, soonest due date first.</p>

	<p><strong id="total">Total to pay: $0.00</strong></p>

	<p id="message"></p>

	<p id="empty-note">Loading invoices...</p>
	<table id="to-pay-table">
		<thead>
			<tr>
				<th>Vendor</th>
				<th>Description</th>
				<th>Amount</th>
				<th>Due date</th>
				<th>Record payment</th>
			</tr>
		</thead>
		<tbody id="to-pay-list"></tbody>
	</table>

	<script src="to-pay.js"></script>
